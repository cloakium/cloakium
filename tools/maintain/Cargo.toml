[package]
name = "cloakium-maintain"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Cloakium release maintenance: upstream candidate preparation and signed release staging"
license = "MIT"

[[bin]]
name = "cloakium-maintain"
path = "src/main.rs"

[lib]
name = "cloakium_maintain"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
wait-timeout = "0.2.1"
xz2 = "0.1.7"

[dev-dependencies]
tempfile = "3.27.0"
