[package]
name = "cloakium-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Headless browser audit maintenance: inventory, plans, runs, comparisons and gap catalogues"
license = "MIT"

[[bin]]
name = "cloakium-audit"
path = "src/main.rs"

[lib]
name = "cloakium_audit"
path = "src/lib.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
wait-timeout = "=0.2.1"

[dev-dependencies]
tempfile = "=3.27.0"
