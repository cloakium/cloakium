name: Build and publish

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable candidate commit (empty means current main)
        required: false
        type: string
      candidate:
        description: Update branch to promote after successful verification
        required: false
        type: string
      bootstrap_tag:
        description: Existing unsigned draft from a verified local build (initial setup only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloakium-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.bootstrap_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      runner: ${{ steps.cache.outputs.runner }}
      cached: ${{ steps.cache.outputs.cached }}
      native: ${{ steps.cache.outputs.native }}
    steps:
      - name: Resolve trusted source before cache inspection
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ -n "$CANDIDATE" ]; then
            [[ "$CANDIDATE" =~ ^updates/[a-f0-9]{12}$ ]]
            expected=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE" --jq .sha)
            [ "$revision" = "$expected" ]
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$revision" --jq .status)
            [ "$status" = ahead ] || [ "$status" = identical ]
            gh api "repos/$GITHUB_REPOSITORY/compare/$main...$revision" --jq '.files[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/update-files"
            while IFS= read -r file; do
              case "$file" in
                flake.lock|upstream.json|package.json|package-lock.json|nix/npm-deps-hash.nix) ;;
                *) echo "Untrusted update path: $file"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/update-files"
          else
            [ "$revision" = "$main" ]
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "main=$main" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.main }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Pin metadata validation and baseline
        id: tools
        run: |
          maintain=$(nix build .#maintain --no-link --print-out-paths)
          echo "maintain=$maintain" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/base/nix"
          cp flake.nix flake.lock upstream.json package.json package-lock.json "$RUNNER_TEMP/base/"
          cp nix/npm-deps-hash.nix "$RUNNER_TEMP/base/nix/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Validate candidate metadata
        if: inputs.candidate != ''
        run: |
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" validate-update --base "$RUNNER_TEMP/base" --candidate .
      - name: Select a cached hosted run or native builder
        id: cache
        env:
          SYSTEM: ${{ vars.CLOAKIUM_SYSTEM || 'x86_64-linux' }}
          NATIVE_RUNNER: ${{ vars.CLOAKIUM_BUILD_RUNNER || '["self-hosted","linux","x64","cloakium-chromium"]' }}
        run: |
          case "$SYSTEM" in x86_64-linux|aarch64-linux) ;; *) exit 1 ;; esac
          native=$(nix eval --raw ".#packages.$SYSTEM.chromium.outPath")
          key=$(cat cache-public-key.txt)
          cache=https://github.com/cloakium/cloakium/releases/latest/download
          if timeout 600 nix store verify --store "$cache" --recursive --no-contents --sigs-needed 1 \
              --option trusted-public-keys "$key" "$native" > "$RUNNER_TEMP/cache-probe.log" 2>&1; then
            if [ "$SYSTEM" = aarch64-linux ]; then runner='["ubuntu-24.04-arm"]'; else runner='["ubuntu-latest"]'; fi
            echo 'cached=true' >> "$GITHUB_OUTPUT"
          else
            runner="$NATIVE_RUNNER"
            echo 'cached=false' >> "$GITHUB_OUTPUT"
            echo 'Native cache miss: a registered large builder is required.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.bootstrap_tag == ''
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 720
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      main_revision: ${{ steps.source.outputs.main_revision }}
      tag: ${{ steps.package.outputs.tag }}
      cache_key: ${{ steps.package.outputs.cache_key }}
    steps:
      - name: Validate immutable source and restricted update diff
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          revision="${REQUESTED_REVISION:-$GITHUB_SHA}"
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ -n "$CANDIDATE" ]; then
            [[ "$CANDIDATE" =~ ^updates/[a-f0-9]{12}$ ]]
            if [ "$main" != "$revision" ]; then
              expected=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE" --jq .sha)
              [ "$revision" = "$expected" ]
            fi
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$main...$revision" --jq .status)
            [ "$status" = ahead ] || [ "$status" = identical ]
            gh api "repos/$GITHUB_REPOSITORY/compare/$main...$revision" --jq '.files[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/update-files"
            while IFS= read -r file; do
              case "$file" in
                flake.lock|upstream.json|package.json|package-lock.json|nix/npm-deps-hash.nix) ;;
                *) echo "Untrusted update path: $file"; exit 1 ;;
              esac
            done < "$RUNNER_TEMP/update-files"
          else
            [ "$revision" = "$main" ]
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "main_revision=$main" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.main_revision }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = big-parallel kvm
            max-jobs = 1
      - name: Pin trusted maintenance binary and comparison data
        id: tools
        run: |
          maintain=$(nix build .#maintain --no-link --print-out-paths)
          echo "maintain=$maintain" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/base/nix"
          cp flake.nix flake.lock upstream.json package.json package-lock.json "$RUNNER_TEMP/base/"
          cp nix/npm-deps-hash.nix "$RUNNER_TEMP/base/nix/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Check update metadata before executing it
        if: inputs.candidate != ''
        run: |
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" validate-update --base "$RUNNER_TEMP/base" --candidate .
      - name: Import verified native cache without a compiler fallback
        if: needs.prepare.outputs.cached == 'true'
        run: |
          native=$(nix eval --raw .#chromium.outPath)
          [ "$native" = '${{ needs.prepare.outputs.native }}' ]
          key=$(cat cache-public-key.txt)
          nix copy --from https://github.com/cloakium/cloakium/releases/latest/download \
            --option require-sigs true --option trusted-public-keys "$key" "$native"
      - name: Build without write tokens or signing credentials
        timeout-minutes: 600
        run: nix build .#chromium .#playwright .#browser --cores 16 --max-jobs 1 -L
      - name: Permit the browser's namespace sandbox on restricted hosted kernels
        id: userns
        if: runner.environment == 'github-hosted'
        run: |
          if unshare --user --map-current-user true 2>/dev/null; then exit 0; fi
          restriction=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ "$restriction" != 1 ]; then
            echo 'User namespaces are unavailable without an AppArmor restriction to configure.' >&2
            exit 1
          fi
          command -v apparmor_parser
          unwrapped=$(nix eval --raw .#chromium-unwrapped.outPath)
          browser=$(nix eval --raw .#chromium.outPath)
          elf="$unwrapped/libexec/chromium/chromium"
          test -x "$elf"
          grep -qF "$elf" "$browser/bin/cloakium-chromium"
          name="cloakium-chromium-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          profile="/etc/apparmor.d/$name"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile %s "%s" flags=(default_allow) {\n  userns,\n}\n' \
            "$name" "$elf" | sudo -n tee "$profile" >/dev/null
          sudo -n apparmor_parser -r "$profile"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          log="$RUNNER_TEMP/sandbox-probe.log"
          if ! timeout --kill-after=5s 45 "$browser/bin/cloakium-chromium" --headless \
              --no-first-run --no-default-browser-check --user-data-dir="$RUNNER_TEMP/sandbox-probe" \
              --dump-dom 'data:text/html,<title>cloakium sandbox probe</title>' > "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          grep -qF '<title>cloakium sandbox probe</title>' "$log"
      - name: Verify the actual patched browser and driver
        env:
          CLOAKIUM_SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          nix develop . -c npm ci --ignore-scripts --no-audit --no-fund
          driver=$(nix eval --raw .#playwright.libPath)
          rm -rf node_modules/playwright-core
          ln -s "$driver" node_modules/playwright-core
          browser=$(nix eval --raw .#chromium.outPath)
          export CLOAKIUM_BINARY_PATH="$browser/bin/cloakium-chromium"
          nix develop . -c npm run verify
          cp artifacts/verification.json "$RUNNER_TEMP/verification.json"
      - name: Remove the temporary browser AppArmor profile
        if: always() && steps.userns.outputs.profile != ''
        env:
          PROFILE: ${{ steps.userns.outputs.profile }}
        run: |
          sudo -n apparmor_parser -R "$PROFILE"
          sudo -n rm -f "$PROFILE"
      - name: Restore immutable source after tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Revalidate staged metadata
        if: inputs.candidate != ''
        run: |
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" validate-update --base "$RUNNER_TEMP/base" --candidate .
      - name: Export unsigned data for an isolated publisher
        id: package
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          rm -rf artifacts/release
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" release --unsigned \
            --revision "$REVISION" --evidence "$RUNNER_TEMP/verification.json"
          echo "cache_key=cloakium-unsigned-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.package.outputs.cache_key }}
          path: artifacts/release
      - name: Retain verification diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: |
            artifacts/verification.json
            artifacts/*.log
          if-no-files-found: ignore

  publish:
    needs: build
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.bootstrap_tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 210
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      REVISION: ${{ needs.build.outputs.revision || inputs.revision || github.sha }}
      BASE_REVISION: ${{ needs.build.outputs.main_revision || github.sha }}
      TAG: ${{ needs.build.outputs.tag || inputs.bootstrap_tag }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.main_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.bootstrap_tag == ''
        with:
          key: ${{ needs.build.outputs.cache_key }}
          path: artifacts/release
          fail-on-cache-miss: true
      - name: Retrieve a verified local bootstrap draft
        if: inputs.bootstrap_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -z "$CANDIDATE"
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TAG" =~ ^chromium-[0-9.]+-pw-[0-9.]+-[a-f0-9]{10}$ ]]
          [ "$REVISION" = "$GITHUB_SHA" ]
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          [ "$draft" = true ]
          mkdir -p artifacts/release
          gh release download "$TAG" --dir artifacts/release
      - name: Build only trusted-main publication tools
        id: tools
        run: |
          maintain=$(nix build .#maintain --no-link --print-out-paths)
          echo "maintain=$maintain" >> "$GITHUB_OUTPUT"
          nix build --inputs-from . nixpkgs#jujutsu --out-link "$RUNNER_TEMP/jujutsu"
          nix build --inputs-from . nixpkgs#cosign --out-link "$RUNNER_TEMP/cosign"
      - name: Reject a stale build before signing or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$current" = "$BASE_REVISION" ] || [ "$current" = "$REVISION" ]
          if [ -n "$CANDIDATE" ] && [ "$current" != "$REVISION" ]; then
            expected=$(gh api "repos/$GITHUB_REPOSITORY/commits/$CANDIDATE" --jq .sha)
            [ "$expected" = "$REVISION" ]
          fi
      - name: Validate and sign data without executing candidate code
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          test -n "$NIX_SIGNING_KEY"
          umask 077
          printf '%s' "$NIX_SIGNING_KEY" > "$RUNNER_TEMP/cloakium-signing.key"
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" sign-release \
            --input artifacts/release --revision "$REVISION" \
            --signing-key "$RUNNER_TEMP/cloakium-signing.key" --public-key cache-public-key.txt
      - name: Sign checksums through public Sigstore
        run: |
          mkdir -p artifacts/provenance
          "$RUNNER_TEMP/cosign/bin/cosign" sign-blob --yes --oidc-provider github-actions \
            --bundle artifacts/provenance/SHA256SUMS.sigstore.json artifacts/release/SHA256SUMS
          "$RUNNER_TEMP/cosign/bin/cosign" verify-blob \
            --bundle artifacts/provenance/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            artifacts/release/SHA256SUMS
      - name: Retain the public Sigstore bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance
          path: artifacts/provenance/
          retention-days: 90
          if-no-files-found: error
      - name: Stage or resume a draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if ! grep -Fxq "refs/tags/$TAG" <<< "$refs"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$REVISION" --silent
          fi
          target=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          [ "$target" = "$REVISION" ]
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/existing-release.json")" = false ]; then
              mkdir -p "$RUNNER_TEMP/published"
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/published/release.json"
              gh release download "$TAG" --pattern SHA256SUMS --pattern manifest.json --dir "$RUNNER_TEMP/published" --clobber
              "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" verify-publication \
                --release-json "$RUNNER_TEMP/published/release.json" \
                --checksums "$RUNNER_TEMP/published/SHA256SUMS" \
                --manifest "$RUNNER_TEMP/published/manifest.json" --revision "$REVISION"
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" --target "$REVISION" --draft --title "$TAG" \
              --notes-file artifacts/release/release-notes.md
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"
      - name: Upload and verify draft assets with bounded pacing
        if: steps.draft.outputs.already_published != 'true'
        timeout-minutes: 185
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "${{ steps.tools.outputs.maintain }}/bin/cloakium-maintain" upload-release \
            --input artifacts/release --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" --revision "$REVISION" --timeout 10800
      - name: Promote the verified candidate with freshness protection
        if: inputs.candidate != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current" = "$REVISION" ]; then exit 0; fi
          [ "$current" = "$BASE_REVISION" ]
          gh auth setup-git
          jj="$RUNNER_TEMP/jujutsu/bin/jj"
          "$jj" git init --colocate
          "$jj" config set --repo user.name '"github-actions[bot]"'
          "$jj" config set --repo user.email '"41898282+github-actions[bot]@users.noreply.github.com"'
          "$jj" git fetch
          fetched=$("$jj" log --no-graph -r main@origin -T commit_id)
          [ "$fetched" = "$BASE_REVISION" ]
          "$jj" bookmark track main@origin
          "$jj" bookmark set main -r "$REVISION"
          "$jj" git push --bookmark main
      - name: Publish only the complete verified release
        if: steps.draft.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [ "$current" = "$REVISION" ]
          gh release edit "$TAG" --draft=false --latest
      - name: Remove successfully integrated update branch
        if: inputs.candidate != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$CANDIDATE" --silent; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$CANDIDATE"
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cloakium-signing.key"
